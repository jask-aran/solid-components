name: Publish package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Verify the tag matches package.json
        run: |
          test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
          test "$(node -p \"require('./package.json').version\")" = "$(node -p \"require('./package.json').version.match(/^[0-9]+\\.[0-9]+\\.[0-9]+$/)?.[0] ?? ''\")"
      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm publish
